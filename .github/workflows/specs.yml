name: Specs

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: specs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: OpenSpec y enlaces
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validar OpenSpec
        run: npx --yes @fission-ai/openspec validate --specs
      - name: Enlaces relativos
        run: python3 scripts/check_links.py
