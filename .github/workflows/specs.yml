name: Specs

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: specs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: OpenSpec y enlaces
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validar OpenSpec
        run: npx --yes @fission-ai/openspec validate --specs
      - name: Enlaces relativos
        run: python3 scripts/check_links.py

  notify:
    name: Notify failure
    needs: validate
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment the failure on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(cat <<EOF
          <!-- g3-specs-ci-failure -->
          ## Specs CI falló

          **Run:** ${RUN_URL}

          El job \`validate\` no pasó. Revisa el log del run; los comandos locales son:

          \`\`\`bash
          npx @fission-ai/openspec validate --specs
          python3 scripts/check_links.py
          \`\`\`
          EOF
          )
          existing=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- g3-specs-ci-failure -->")) | .id' | head -n1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$existing" -f body="$body"
          else
            gh api --method POST "repos/${{ github.repository }}/issues/$PR/comments" -f body="$body"
          fi
