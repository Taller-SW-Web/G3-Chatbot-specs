<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1920 840" width="1920" height="840"><defs><marker id="ae" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker><marker id="as" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="1920" height="840" fill="#ffffff"/><text x="20" y="42.6" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="28px" fill="#1e1e1e" text-anchor="start">Flujo asíncrono · outbox → RabbitMQ → consumidor</text><text x="20" y="72.25" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="15px" fill="#495057" text-anchor="start">Producción (Railway, Supabase, CloudAMQP) · ADR-0030 · verificado el 2026-11-27</text><rect x="20" y="95" width="540" height="650" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-width="2" stroke-dasharray="8 10"/><text x="40" y="126" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="20px" fill="#1e1e1e" text-anchor="start">Railway · G3-Chatbot-backend (API)</text><rect x="600" y="95" width="630" height="650" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-width="2" stroke-dasharray="8 10"/><text x="620" y="126" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="20px" fill="#1e1e1e" text-anchor="start">CloudAMQP · RabbitMQ</text><rect x="1260" y="95" width="320" height="650" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-width="2" stroke-dasharray="8 10"/><text x="1280" y="126" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="20px" fill="#1e1e1e" text-anchor="start">Railway · G3-Chatbot-consumer</text><rect x="1620" y="95" width="280" height="650" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-width="2" stroke-dasharray="8 10"/><text x="1640" y="126" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="20px" fill="#1e1e1e" text-anchor="start">Módulos externos</text><rect x="50" y="150" width="480" height="100" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/><text x="290" y="194.6" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="18px" fill="#495057" text-anchor="middle">Casos de uso</text><text x="290" y="217.1" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="18px" fill="#495057" text-anchor="middle">checkout y sugerencias</text><rect x="50" y="300" width="480" height="110" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="290" y="339.275" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="17px" fill="#2f9e44" text-anchor="middle">PostgreSQL (Supabase)</text><text x="290" y="360.525" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="17px" fill="#2f9e44" text-anchor="middle">fila de negocio + fila outbox</text><text x="290" y="381.775" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="17px" fill="#2f9e44" text-anchor="middle">en UNA transacción</text><rect x="50" y="450" width="480" height="210" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text x="290" y="500.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#1971c2" text-anchor="middle">Relay del outbox (mismo proceso)</text><text x="290" y="520.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#1971c2" text-anchor="middle">OUTBOX_DISPATCH_MODE=broker</text><text x="290" y="540.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#1971c2" text-anchor="middle">publisher confirms</text><text x="290" y="560.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#1971c2" text-anchor="middle">PROCESSED solo tras el confirm</text><text x="290" y="580.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#1971c2" text-anchor="middle">message_id AMQP = id de la fila</text><text x="290" y="600.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#1971c2" text-anchor="middle">broker caído: sigue PENDING</text><text x="290" y="620.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#1971c2" text-anchor="middle">con backoff, attempts sin cambio</text><polyline points="290,250 290,298" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ae)"/><polyline points="290,448 290,412" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ae)" marker-start="url(#as)"/><rect x="630" y="150" width="570" height="110" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text x="915" y="190.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#e8590c" text-anchor="middle">Exchange chatbot.eventos.dlx (direct)</text><text x="915" y="210.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#e8590c" text-anchor="middle">fallo no reintentable o reintentos agotados</text><text x="915" y="230.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#e8590c" text-anchor="middle">→ chatbot.ventas.dlq · chatbot.notificaciones.dlq</text><rect x="630" y="470" width="170" height="110" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text x="715" y="510.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#e8590c" text-anchor="middle">Exchange</text><text x="715" y="530.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#e8590c" text-anchor="middle">chatbot.eventos</text><text x="715" y="550.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#e8590c" text-anchor="middle">(topic)</text><rect x="850" y="340" width="350" height="150" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="1025" y="382.375" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="15px" fill="#e67700" text-anchor="middle">chatbot.ventas (ventas.#)</text><text x="1025" y="401.125" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="15px" fill="#e67700" text-anchor="middle">reintentos: .retry.5s/15s/45s/2m/5m</text><text x="1025" y="419.875" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="15px" fill="#e67700" text-anchor="middle">DLQ: chatbot.ventas.dlq</text><text x="1025" y="438.625" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="15px" fill="#e67700" text-anchor="middle">NOTIFY_SALES_PAYMENT</text><text x="1025" y="457.375" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="15px" fill="#e67700" text-anchor="middle">REQUEST_CANCELLATION</text><rect x="850" y="560" width="350" height="150" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="1025" y="602.375" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="15px" fill="#e67700" text-anchor="middle">chatbot.notificaciones</text><text x="1025" y="621.125" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="15px" fill="#e67700" text-anchor="middle">(notificaciones.#)</text><text x="1025" y="639.875" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="15px" fill="#e67700" text-anchor="middle">reintentos: .retry.1m/5m/15m</text><text x="1025" y="658.625" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="15px" fill="#e67700" text-anchor="middle">DLQ: chatbot.notificaciones.dlq</text><text x="1025" y="677.375" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="15px" fill="#e67700" text-anchor="middle">SEND_EMAIL · SEND_FEEDBACK_EMAIL</text><polyline points="530,525 628,525" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#ae)"/><polyline points="800,500 848,415" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ae)"/><polyline points="800,550 848,635" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ae)"/><polyline points="1025,338 1025,262" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ae)"/><rect x="1280" y="400" width="280" height="260" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text x="1420" y="465.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#6741d9" text-anchor="middle">Consumidor (servicio aparte)</text><text x="1420" y="485.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#6741d9" text-anchor="middle">python -m</text><text x="1420" y="505.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#6741d9" text-anchor="middle">src.infrastructure.consumer</text><text x="1420" y="525.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#6741d9" text-anchor="middle">GET /health</text><text x="1420" y="545.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#6741d9" text-anchor="middle">ack manual</text><text x="1420" y="565.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#6741d9" text-anchor="middle">idempotencia: transaccionId</text><text x="1420" y="585.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#6741d9" text-anchor="middle">falla: .retry.&lt;espera&gt;</text><text x="1420" y="605.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#6741d9" text-anchor="middle">o DLX/DLQ</text><polyline points="1200,415 1278,470" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ae)"/><polyline points="1200,635 1278,590" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ae)"/><rect x="1640" y="330" width="240" height="150" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/><text x="1760" y="380.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#495057" text-anchor="middle">G5 Ventas (Render)</text><text x="1760" y="400.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#495057" text-anchor="middle">POST /pedidos/{id}/</text><text x="1760" y="420.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#495057" text-anchor="middle">pagos/notificacion</text><text x="1760" y="440.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#495057" text-anchor="middle">token de G7</text><rect x="1640" y="550" width="240" height="120" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><text x="1760" y="595.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#868e96" text-anchor="middle">Envío de correo</text><text x="1760" y="615.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#868e96" text-anchor="middle">FakeEmailSender</text><text x="1760" y="635.2" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16px" fill="#868e96" text-anchor="middle">(SMTP_HOST sin definir)</text><polyline points="1560,470 1638,420" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ae)"/><polyline points="1560,590 1638,605" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ae)"/><text x="20" y="789.25" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="15px" fill="#495057" text-anchor="start">message_id AMQP = id de la fila outbox: se ve en la fila (PROCESSED, processed_at) y en el log del consumidor (event=consumed ... message_id=...).</text><text x="20" y="808" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="15px" fill="#495057" text-anchor="start">Broker caído: la fila sigue PENDING y se reintenta con backoff (5s, 9s, 19s, 39s...) sin consumir su presupuesto de reintentos; al volver el broker se publica.</text></svg>
